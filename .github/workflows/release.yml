name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # pyinstaller fijado a la versión con la que se construye localmente:
        # evita diferencias en el empaquetado de DLLs entre builds.
        run: pip install -r requirements.txt "pyinstaller==6.21.0"

      - name: Build executable
        run: pyinstaller KazLauncher.spec --noconfirm

      - name: Create update manifest
        shell: pwsh
        run: |
          $sha = (Get-FileHash dist/KazLauncher.exe -Algorithm SHA256).Hash.ToLower()
          $manifest = @{
            version = $env:GITHUB_REF_NAME
            url     = "https://github.com/${{ github.repository }}/releases/latest/download/KazLauncher.exe"
            sha256  = $sha
          } | ConvertTo-Json -Compress
          [System.IO.File]::WriteAllText("$pwd/latest.json", $manifest, [System.Text.Encoding]::ASCII)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # Idempotente: si la release del tag ya existe (p. ej. un run previo
          # publicó antes), la reutiliza y sobrescribe los binarios con esta build.
          reuse_release: true
          overwrite: true
          files: |
            dist/KazLauncher.exe
            latest.json
