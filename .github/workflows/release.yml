name: Build & Release

# Workflow SIN actions de terceros: el repo tiene la política "solo actions de
# kazdev97", así que aquí no se usa ningún `uses:` — solo pasos `run` con las
# herramientas ya instaladas en el runner (git, Python y GitHub CLI `gh`).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar (ej. v1.2.9)'
        required: true
        default: 'v1.2.9'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        run: |
          git clone --quiet --depth 1 --branch "$RELEASE_VERSION" \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" .

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          python -m pip install -r requirements.txt "pyinstaller==6.21.0" --quiet

      - name: Build executable
        run: python -m PyInstaller KazLauncher.spec --noconfirm

      - name: Create update manifest
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        run: |
          $sha = (Get-FileHash dist/KazLauncher.exe -Algorithm SHA256).Hash.ToLower()
          $manifest = @{
            version = $env:RELEASE_VERSION
            url     = "https://github.com/${{ github.repository }}/releases/latest/download/KazLauncher.exe"
            sha256  = $sha
          } | ConvertTo-Json -Compress
          [System.IO.File]::WriteAllText("$pwd/latest.json", $manifest, [System.Text.Encoding]::ASCII)

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        run: |
          # Crea la release si no existe; si ya existe (re-run), la reutiliza.
          gh release create "$RELEASE_VERSION" \
            --repo "${{ github.repository }}" \
            --title "$RELEASE_VERSION" \
            --notes "" || true
          # Sobrescribe los binarios con esta build (equivalente a overwrite: true).
          gh release upload "$RELEASE_VERSION" \
            dist/KazLauncher.exe latest.json \
            --repo "${{ github.repository }}" \
            --clobber
