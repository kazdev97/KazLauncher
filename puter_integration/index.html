<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Puter Codex Demo</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 900px;
        margin: 40px auto;
        padding: 20px;
        background: #121212;
        color: #f5f5f5;
      }
      .card {
        background: #1e1e1e;
        padding: 20px;
        border-radius: 12px;
      }
      textarea, select, button {
        width: 100%;
        margin-top: 10px;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #444;
        font-size: 14px;
      }
      button {
        background: #2563eb;
        color: white;
        cursor: pointer;
      }
      pre {
        white-space: pre-wrap;
        background: #0f172a;
        padding: 12px;
        border-radius: 8px;
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Integración Puter + Codex</h1>
      <p>Prueba modelos como GPT-5.1-Codex-Mini o Codex Max desde tu navegador.</p>

      <label for="prompt">Prompt</label>
      <textarea id="prompt" rows="6">Escribe una función en Python para ordenar una lista con quicksort.</textarea>

      <label for="model">Modelo</label>
      <select id="model">
        <option value="openai/gpt-5.1-codex-mini">openai/gpt-5.1-codex-mini</option>
        <option value="openai/gpt-5.1-codex-max">openai/gpt-5.1-codex-max</option>
        <option value="openai/gpt-5.3-codex">openai/gpt-5.3-codex</option>
      </select>

      <button id="run">Enviar</button>
      <p id="status">Esperando...</p>
      <pre id="output">Tu respuesta aparecerá aquí.</pre>
    </div>

    <script src="https://js.puter.com/v2/"></script>
    <script src="./app.js"></script>
  </body>
</html>
